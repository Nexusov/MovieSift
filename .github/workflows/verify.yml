name: Verify and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      retain_candidates:
        description: Retain verified binary and matching material archives as publicly accessible workflow artifacts
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Required media checks and ${{ matrix.runtime }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            runtime: win-x64
            archive: TrackTrim-win-x64.zip
          - os: ubuntu-24.04
            runtime: linux-x64
            archive: TrackTrim-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TRACKTRIM_REQUIRE_MEDIA_TOOLS: '1'
      TRACKTRIM_TOOL_DIRECTORY: ${{ github.workspace }}/tools
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Provision Linux build/test native prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential nasm squashfs-tools file libx11-6 libice6 libsm6 libfontconfig1 libicu74 libssl3t64 libgssapi-krb5-2 libbrotli1 libgmp10 libgl1 libegl1 libxrandr2 libxcursor1 libxi6 libxinerama1
      - name: Restore the exact Windows MKV source build
        if: runner.os == 'Windows'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/mkv-source-candidate
          key: windows-mkv-source-${{ hashFiles('build/*mkv*', 'build/ffmpeg-runtime-dependencies.py') }}
      - name: Build or validate the pinned Windows MKV workers and materials
        if: runner.os == 'Windows'
        run: |
          $mkvBuildDirectory = Join-Path '${{ runner.temp }}' 'mkv-source-candidate'
          ./build/provision-windows-mkv.ps1 -Destination $mkvBuildDirectory -CacheDirectory '${{ runner.temp }}/mkv-source-downloads'
          ('TRACKTRIM_WINDOWS_MKV_BUILD_DIRECTORY=' + $mkvBuildDirectory) | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8NoBOM
      - name: Provision pinned Windows source-build prerequisites
        if: runner.os == 'Windows'
        run: ./build/provision-windows-ffmpeg.ps1
      - name: Acquire the pinned MKV and MP4 backends (mandatory)
        run: ./build/acquire-tools.ps1 -RuntimeIdentifier '${{ matrix.runtime }}' -Destination '${{ github.workspace }}/tools'
      - name: Generate original real-media fixtures
        run: |
          python ./build/generate-fixtures.py --tool-directory '${{ github.workspace }}/tools' --destination '${{ github.workspace }}/artifacts/fixtures'
          if ($LASTEXITCODE -ne 0) { throw 'Real fixture generation failed.' }
          $ffmpegName = 'ffmpeg'
          if ($IsWindows) { $ffmpegName += '.exe' }
          $ffmpegPath = Join-Path '${{ github.workspace }}/tools' $ffmpegName
          python ./build/generate-mp4-fixtures.py --ffmpeg $ffmpegPath --destination '${{ github.workspace }}/artifacts/fixtures/mp4'
          if ($LASTEXITCODE -ne 0) { throw 'Required MP4 fixture generation failed.' }
      - name: Restore locked dependencies
        run: dotnet restore --locked-mode
      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Distribution evidence regression checks
        run: |
          python -m unittest discover -s build/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Distribution evidence regression checks failed.' }
      - name: Unit, headless UI and required real-backend tests
        run: dotnet test --configuration Release --no-build --no-restore --logger trx --results-directory ./TestResults
      - name: Build self-contained archive and run packaged workflow
        run: ./build/package.ps1 -RuntimeIdentifier '${{ matrix.runtime }}' -FixturePath '${{ github.workspace }}/artifacts/fixtures/ordinary.mkv' -Mp4FixturePath '${{ github.workspace }}/artifacts/fixtures/mp4/ordinary.mp4'
      - name: Relocate archive and run the actual application workflow
        run: ./build/verify-package.ps1 -ArchivePath './artifacts/${{ matrix.archive }}' -FixturePath '${{ github.workspace }}/artifacts/fixtures/ordinary.mkv' -Mp4FixturePath '${{ github.workspace }}/artifacts/fixtures/mp4/ordinary.mp4'
      - name: Prepare matching review source and build materials
        run: |
          python ./build/prepare-review-materials.py --repository . --archive './artifacts/${{ matrix.archive }}' --inventory './artifacts/distribution-reports/${{ matrix.runtime }}/distribution-${{ matrix.runtime }}.json' --output './artifacts/review-materials-${{ matrix.runtime }}'
          if ($LASTEXITCODE -ne 0) { throw 'Matching review-material preparation failed.' }
          Copy-Item -LiteralPath './artifacts/review-materials-${{ matrix.runtime }}/material-summary.json' -Destination './artifacts/distribution-reports/${{ matrix.runtime }}/review-materials.json'
      - name: Verify Linux CLI archive without installed SDK or media tools
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./build/verify-clean-linux.sh ./artifacts/TrackTrim-linux-x64.tar.gz ./artifacts/fixtures/ordinary.mkv ./artifacts/fixtures/mp4/ordinary.mp4
      - name: Validate and stage the explicitly requested candidate set
        id: candidates
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.retain_candidates == true }}
        run: |
          $selection = python ./build/prepare-candidate-retention.py --repository . --archive './artifacts/${{ matrix.archive }}' --inventory './artifacts/distribution-reports/${{ matrix.runtime }}/distribution-${{ matrix.runtime }}.json' --materials './artifacts/review-materials-${{ matrix.runtime }}' --runtime '${{ matrix.runtime }}' --source-revision '${{ github.sha }}' --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}' --output './artifacts/candidate-retention-${{ matrix.runtime }}'
          if ($LASTEXITCODE -ne 0) { throw 'Candidate identity validation or staging failed.' }
          $selection = $selection | ConvertFrom-Json
          ('artifact_name=' + $selection.artifactName) | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8NoBOM
          ('materials_name=' + $selection.materialsName) | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8NoBOM
      - name: Retain the explicitly requested verified candidate set
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.retain_candidates == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.candidates.outputs.artifact_name }}
          path: |
            artifacts/candidate-retention-${{ matrix.runtime }}/${{ matrix.archive }}
            artifacts/candidate-retention-${{ matrix.runtime }}/${{ steps.candidates.outputs.materials_name }}
            artifacts/candidate-retention-${{ matrix.runtime }}/distribution-${{ matrix.runtime }}.json
            artifacts/candidate-retention-${{ matrix.runtime }}/material-summary.json
            artifacts/candidate-retention-${{ matrix.runtime }}/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-evidence-${{ matrix.runtime }}
          path: |
            TestResults/
            artifacts/distribution-reports/
            artifacts/**/native-dependencies.txt
            artifacts/**/build-provenance.json
            artifacts/**/tool-provenance.json
            artifacts/**/evidence/container-environment.txt
            artifacts/**/evidence/container-workflow.txt
          if-no-files-found: warn
          retention-days: 7
      # PRs, pushes and default manual runs retain evidence only. Candidate sets
      # require explicit manual opt-in after every required platform check passes.
